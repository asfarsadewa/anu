<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Anu</title>
<meta name="description" content="Build a small Indonesian town on a limited grid. Water, mud, ash, wind and ground motion are real physics.">
<meta name="theme-color" content="#fffdf7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="canonical" href="https://anu.asfarlab.fun/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Anu">
<meta property="og:url" content="https://anu.asfarlab.fun/">
<meta property="og:title" content="Anu">
<meta property="og:description" content="Build a small Indonesian town on a limited grid. Water, mud, ash, wind and ground motion are real physics.">
<meta property="og:image" content="https://anu.asfarlab.fun/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A pixel art town in Salatiga, with the Merbabu volcano behind it.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Anu">
<meta name="twitter:description" content="Build a small Indonesian town on a limited grid. Water, mud, ash, wind and ground motion are real physics.">
<meta name="twitter:image" content="https://anu.asfarlab.fun/og.png">
<meta name="twitter:image:alt" content="A pixel art town in Salatiga, with the Merbabu volcano behind it.">
<link rel="stylesheet" href="anu.css">
</head>
<body>
<canvas id="c" data-t-aria="ui.aTown" aria-label="The town and the land around it."></canvas>

<header id="hud" hidden>
  <div id="hud-row">
    <button id="menu" class="icon-btn" type="button" data-t-aria="ui.aMenu" aria-label="Open the menu"><span class="burger"></span></button>
    <div class="stat" id="s-people" role="button" tabindex="0"><img alt="People" data-t-alt="ui.aPeople" data-icon="person"><b>0</b><small>/0</small></div>
    <div class="stat" id="s-rice" role="button" tabindex="0"><img alt="Rice" data-t-alt="ui.aRice" data-icon="rice"><b>0</b><small>/0</small></div>
    <div class="stat" id="s-labour" role="button" tabindex="0"><img alt="Labour" data-t-alt="ui.aLabour" data-icon="labour"><b>0</b></div>
    <button id="mute" class="icon-btn" type="button" aria-pressed="false" data-t-aria="ui.aSound" aria-label="Sound"><img alt="" data-icon="sound"></button>
  </div>
  <button id="goal" type="button"><span id="goal-text"></span></button>
  <div id="months" role="list"></div>
</header>

<div id="toasts" aria-live="polite"></div>
<div id="say" hidden><img id="say-face" alt=""><p><b data-t="ui.speaker">Bu Lurah</b><span id="say-text"></span></p></div>

<footer id="tray" hidden>
  <div id="cards" role="listbox" data-t-aria="ui.aBuildings" aria-label="Buildings"></div>
  <div id="actions">
    <button id="undo" type="button" data-t="ui.undo">Undo</button>
    <button id="forecast" type="button" data-t="ui.forecast">Forecast</button>
    <button id="next" type="button">Next month</button>
  </div>
</footer>
<footer id="runbar" hidden>
  <div id="run-label"></div>
  <button id="speed" type="button" data-t="ui.fast">Fast</button>
</footer>

<section id="title" hidden>
  <canvas id="wordmark" width="10" height="10" aria-label="Anu"></canvas>
  <p id="title-sub" data-t="ui.titleSub">A town builder.</p>
  <div id="ts"></div>
  <div id="lang" role="group" aria-label="Language / Bahasa / 语言"><button type="button" data-lang="en" lang="en">English</button><button type="button" data-lang="id" lang="id">Bahasa Indonesia</button><button type="button" data-lang="zh" lang="zh-Hans">中文</button></div>
  <div id="look" role="group" data-t-aria="ui.aLook" aria-label="Display"><button type="button" data-look="pixels" data-t="ui.lookPixels">Pixels</button><button type="button" data-look="smooth" data-t="ui.lookSmooth">Smooth</button></div>
  <button id="start" type="button" data-t="ui.start">Tap to start</button>
  <a id="credit" href="https://x.com/ashthepeasant" target="_blank" rel="noopener">@ashthepeasant</a>
</section>

<section id="map" hidden>
  <canvas id="map-c" width="360" height="170" data-t-aria="ui.aMap" aria-label="Map of Indonesia"></canvas>
  <ol id="levels"></ol>
</section>

<dialog id="sheet"></dialog>
<script type="module" src="js/main.js"></script>
</body>
</html>
